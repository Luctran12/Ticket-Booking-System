jwt:
  secret: 
  expiration: 86400000  # 24 hours

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method   # sort theo GET/POST/PUT/DELETE
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

spring:
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

# Key conventions
redis:
  key:
    ticket-stock: "ticket_stock:"    # ticket_stock:{ticketId}
    order-status: "order_status:"    # order_status:{orderId}
  ttl:
    order-status: 3600  # 1 hour (seconds)